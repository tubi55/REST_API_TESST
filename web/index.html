<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>고객 목록</h1>

    <button id="btn1">고객정보 확인하기</button>
    <button id="btn2">상품정보 확인하기</button>
    <button id="btn3">특정 고객정보 확인</button>

    <section id="frame"></section>

    <!-- 상품정보를 추가하기 위한 폼 요소 -->
    <form id="productForm">
      <p>
        <label>이름 <input name="name" /></label>
      </p>
      <p>
        <label>브랜드 <input name="brand" /></label>
      </p>
      <p>
        <label
          >분류
          <select name="category"></select
        ></label>
      </p>
      <p>
        <label
          >피부 타입
          <select name="skinType"></select
        ></label>
      </p>
      <p>
        <label>가격 <input name="price" type="number" min="0" /></label>
      </p>
      <p>
        <label>용량 <input name="volume" /></label>
      </p>
      <p>
        <label>성분 <input name="ingredient" /></label>
      </p>
      <p>
        <label>고민 <input name="concern" /></label>
      </p>
      <p>
        <label>태그 <input name="tags" /></label>
      </p>
      <p>
        <label>설명 <textarea name="description" rows="3" cols="50"></textarea></label>
      </p>
    </form>

    <script src="app.js"></script>
  </body>
</html>
