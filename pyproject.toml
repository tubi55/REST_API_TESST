[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["pipeline*", "eval*", "tests*"]

[project]
name = "cosmetic-admin"
version = "0.3.0"
description = "화장품 회사 관리자용 AI 대시보드. 검색 · 추천 · 질의응답"
requires-python = ">=3.11"

dependencies = [
    "fastapi~=0.141",
    "uvicorn~=0.52",
    "pydantic~=2.12",

    "langchain-core~=1.5",
    "langchain-openai~=1.4",
    "langchain-text-splitters~=1.1",
    "openai~=2.53",

    "transformers~=5.14",
    "huggingface-hub~=1.24",

    "numpy~=2.4",
]

[project.optional-dependencies]
local = [
    "sentence-transformers~=5.6",
    "langchain-huggingface~=1.2",
]

trace = [
    "langsmith~=0.10",
]

eval = [
    "ragas~=0.4.3",
    "langchain-community~=0.3.31",
]

dev = [
    "pytest~=9.1",
    "httpx~=0.28",
    "ruff~=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]
