<title>화면이 서버와 말하는 법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper:#F1F3F4; --card:#FBFCFC; --ink:#17212B; --muted:#5A6672;
  --rule:#D3D9DD; --rule-soft:#E4E9EB; --chip:#E7ECEE; --grid:#E9EDEF;
  --oxide:#B4501E; --oxide-soft:#F7E9E0;
  --teal:#16697A; --teal-soft:#DFEDEF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
    --rule:#2C3842; --rule-soft:#232E37; --chip:#232E37; --grid:#1E2831;
    --oxide:#E08A55; --oxide-soft:#3A2418;
    --teal:#63B0C0; --teal-soft:#16303A;
  }
}
:root[data-theme="dark"] {
  --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
  --rule:#2C3842; --rule-soft:#232E37; --chip:#232E37; --grid:#1E2831;
  --oxide:#E08A55; --oxide-soft:#3A2418;
  --teal:#63B0C0; --teal-soft:#16303A;
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  line-height:1.72; -webkit-font-smoothing:antialiased;
}
:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

.deck { height:100%; display:flex; flex-direction:column; }

.bar {
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  padding:0 20px; height:50px;
  background:var(--card); border-bottom:1px solid var(--rule);
}
.mark {
  font-family:"Gowun Batang", Georgia, serif; font-weight:700; font-size:17px;
  white-space:nowrap; letter-spacing:-.015em;
}
.mark span { color:var(--teal); }
.bar .spacer { flex:1; }
.phase {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.count {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px;
  color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.count b { color:var(--ink); font-weight:500; }
.nav-btn {
  width:34px; height:28px; border:1px solid var(--rule); border-radius:4px;
  background:transparent; color:var(--ink); cursor:pointer;
  font-size:14.5px; line-height:1; display:grid; place-items:center;
}
.nav-btn:hover { background:var(--chip); }
.nav-btn:disabled { opacity:.32; cursor:default; }
.track { flex:0 0 auto; height:2px; background:var(--rule-soft); }
.track i { display:block; height:100%; background:var(--teal); transition:width .2s ease; }

.split { flex:1; min-height:0; display:grid; grid-template-columns:60% 40%; }

.figure {
  min-width:0; overflow:auto; padding:26px 24px 32px;
  display:flex; flex-direction:column; align-items:center;
  /* safe center 라야 그림이 칸보다 클 때 위쪽이 안 잘린다 */
  justify-content:center; justify-content:safe center;
  gap:14px; border-right:1px solid var(--rule);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
}
.figure svg { width:100%; max-width:750px; height:auto; display:block; flex:0 0 auto; }
.figcap {
  font-size:13.5px; color:var(--muted); text-align:center; max-width:700px;
  background:var(--paper); padding:2px 10px; border-radius:3px; flex:0 0 auto;
}

/* 그림 안의 공통 조각 */
.b-off  { fill:var(--card); stroke:var(--rule); stroke-width:1; }
.b-on   { fill:var(--teal-soft); stroke:var(--teal); stroke-width:1.6; }
.b-warn { fill:var(--oxide-soft); stroke:var(--oxide); stroke-width:1.6; }
.b-ghost{ fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:3 3; }
.t1 { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12.5px;
      fill:var(--ink); text-anchor:middle; }
.t2 { font-family:"IBM Plex Sans KR", sans-serif; font-size:11px;
      fill:var(--muted); text-anchor:middle; }
.t3 { font-family:"IBM Plex Sans KR", sans-serif; font-size:11px;
      fill:var(--muted); text-anchor:middle; }
.b-ont { fill:var(--teal); }
.b-warnt { fill:var(--oxide); }
.lft { text-anchor:start; }
.rgt { text-anchor:end; }
.ar { stroke:var(--muted); stroke-width:1.4; fill:none; }
.ar-on { stroke:var(--teal); stroke-width:2; fill:none; }
.ar-warn { stroke:var(--oxide); stroke-width:1.8; fill:none; }
.arh { fill:var(--muted); }
.arh-on { fill:var(--teal); }
.arh-warn { fill:var(--oxide); }

.notes { min-width:0; overflow-y:auto; padding:28px 28px 58px; }
.notes-in { max-width:660px; display:flex; flex-direction:column; gap:21px; }
.eyebrow { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.badge {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10.5px;
  letter-spacing:.06em; padding:2px 8px; border-radius:3px;
  border:1px solid var(--teal); color:var(--teal); background:var(--teal-soft);
}
.badge.gray { border-color:var(--rule); color:var(--muted); background:var(--chip); }
.step-no {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
h1 {
  margin:0; font-family:"Gowun Batang", Georgia, serif;
  font-size:30px; font-weight:700; line-height:1.36; text-wrap:balance;
  letter-spacing:-.015em;
}
.lead { margin:0; font-size:17px; }
.sec { display:flex; flex-direction:column; gap:9px; }
.sec > h2 {
  margin:0; font-family:"IBM Plex Mono", ui-monospace, monospace;
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); font-weight:500;
}

.chain {
  display:grid; grid-template-columns:1fr max-content;
  border:1px solid var(--rule); border-radius:4px; overflow:hidden;
  background:var(--card);
}
.chain > div { padding:6px 12px; border-top:1px solid var(--rule-soft); }
.chain > div.top { border-top:0; }
.chain .fn {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13.5px;
  white-space:pre; overflow-x:auto;
}
.chain .fn b { font-weight:500; color:var(--teal); }
.chain .fn i { font-style:normal; color:var(--oxide); }
.chain .at {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11.5px;
  color:var(--muted); white-space:nowrap; border-left:1px solid var(--rule-soft);
}

ol.steps { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
ol.steps li {
  display:grid; grid-template-columns:21px 1fr; gap:10px; font-size:15px;
}
ol.steps li .n {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12px;
  color:var(--teal); padding-top:4px; font-variant-numeric:tabular-nums;
}

.note {
  border-left:3px solid var(--teal); background:var(--teal-soft);
  padding:11px 14px; border-radius:0 4px 4px 0; font-size:15px;
}
.note.warn { border-left-color:var(--oxide); background:var(--oxide-soft); }
.note h3 { margin:0 0 4px; font-size:13.5px; font-weight:600; color:var(--teal); }
.note.warn h3 { color:var(--oxide); }
.note p { margin:0; }
.note p + p { margin-top:7px; }

.grid {
  display:grid; border:1px solid var(--rule); border-radius:4px;
  overflow:hidden; background:var(--card); font-size:14.5px;
}
.grid > div { padding:7px 11px; border-top:1px solid var(--rule-soft); }
.grid > div.top { border-top:0; }
.grid .bl { border-left:1px solid var(--rule-soft); }
.grid .h {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  background:var(--chip); white-space:nowrap;
}
.grid .c {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px;
  white-space:nowrap; color:var(--teal); font-variant-numeric:tabular-nums;
}
code.k {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.88em;
  background:var(--chip); padding:1px 6px; border-radius:3px;
}
.cap { font-size:13px; color:var(--muted); margin:0; }

/* 좁아지면 위아래로 쌓고 페이지 전체가 세로로 스크롤되게 둔다 */
@media (max-width:1060px) {
  .split { display:block; overflow-y:auto; }
  .figure {
    border-right:0; border-bottom:1px solid var(--rule);
    padding:18px 14px 22px; overflow:visible;
  }
  .notes { overflow:visible; padding:22px 18px 50px; }
  .notes-in { max-width:none; }
  .figure svg { max-width:660px; }
}
@media (max-width:700px) {
  h1 { font-size:24px; }
  .lead { font-size:15.5px; }
  .note, ol.steps li { font-size:14px; }
  .grid { font-size:13.5px; }
  .mark { font-size:13px; }
  .phase { display:none; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

.code {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px;
  background:var(--card); border:1px solid var(--rule); border-radius:4px;
  padding:10px 13px; white-space:pre; overflow-x:auto; line-height:1.66;
}
.code b { font-weight:500; color:var(--teal); }
.code i { font-style:normal; color:var(--oxide); }
.code s { text-decoration:none; color:var(--muted); }
.where { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12px; color:var(--muted); }
</style>

<div class="deck">
  <div class="bar">
    <div class="mark">화면이 서버와 말하는 법 <span>web/index.html</span></div>
    <div class="spacer"></div>
    <div class="phase" id="phase"></div>
    <button class="nav-btn" id="prev" aria-label="이전 장">&#8249;</button>
    <div class="count"><b id="at">1</b> / <span id="of">1</span></div>

  <div class="track"><i id="bar"></i></div>

    <div class="notes" id="notes"><div class="notes-in" id="notes-in"></div></div>
  </div>
</div>

<script>
/* ── 그림 조각. 앞 슬라이드와 같은 것을 쓴다 ───────────────── */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function svg(vb, body) { return '<svg viewBox="' + vb + '" role="img">' + body + '</svg>'; }

function bx(x, y, w, h, title, sub, tone) {
  const t = tone || 'off';
  const cx = x + w / 2;
  let s = '<rect class="b-' + t + '" x="' + x + '" y="' + y + '" width="' + w +
          '" height="' + h + '" rx="4"/>';
  const tint = t === 'on' ? ' b-ont' : (t === 'warn' ? ' b-warnt' : '');
  if (sub) {
    s += '<text class="t1' + tint + '" x="' + cx + '" y="' + (y + h / 2 - 3) + '">' + title + '</text>';
    s += '<text class="t2" x="' + cx + '" y="' + (y + h / 2 + 13) + '">' + sub + '</text>';
  } else {
    s += '<text class="t1' + tint + '" x="' + cx + '" y="' + (y + h / 2 + 5) + '">' + title + '</text>';
  }
  return s;
}

function ar(x1, y1, x2, y2, tone, label) {
  const t = tone || '';
  const cls = t ? 'ar-' + t : 'ar';
  const hcls = t ? 'arh-' + t : 'arh';
  const a = Math.atan2(y2 - y1, x2 - x1);
  const px = (ang) => (x2 - 10 * Math.cos(a + ang)) + ',' + (y2 - 10 * Math.sin(a + ang));
  let s = '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' +
          (x2 - 6 * Math.cos(a)) + '" y2="' + (y2 - 6 * Math.sin(a)) + '"/>';
  s += '<polygon class="' + hcls + '" points="' + x2 + ',' + y2 + ' ' + px(0.38) + ' ' + px(-0.38) + '"/>';
  if (label) {
    let nx = Math.sin(a), ny = -Math.cos(a);
    if (ny > 0) { nx = -nx; ny = -ny; }
    s += '<text class="t3" x="' + ((x1 + x2) / 2 + nx * 15) + '" y="' +
         ((y1 + y2) / 2 + ny * 15 + 4) + '">' + label + '</text>';
  }
  return s;
}

/* ── 되풀이되는 그림. 화면에서 서버까지 한 줄 ──────────────── */
function wire(lit, method, path) {
  const on = new Set(lit || []);
  const t = (id) => (on.has(id) ? 'on' : 'off');
  let s = '<line class="b-ghost" x1="450" y1="14" x2="450" y2="178"/>';
  s += '<text class="t3" x="232" y="26">브라우저</text>';
  s += '<text class="t3" x="527" y="26">서버</text>';
  s += bx(15, 40, 120, 54, 'DOM', '화면의 요소', t('dom'));
  s += bx(165, 40, 120, 54, 'JS 함수', '값을 모은다', t('fn'));
  s += bx(315, 40, 120, 54, 'fetch()', method || '메서드', t('net'));
  s += bx(465, 40, 120, 54, 'FastAPI', path || '/api/...', t('api'));
  s += ar(135, 67, 165, 67) + ar(285, 67, 315, 67) + ar(435, 67, 465, 67);
  s += '<path class="ar-on" d="M 525 94 V 150 H 75 V 102"/>';
  s += '<polygon class="arh-on" points="75,94 70,105 80,105"/>';
  s += '<text class="t3" x="300" y="170">응답을 받아 화면을 다시 그린다</text>';
  return svg('0 0 600 186', s);
}

/* ── 슬라이드 ─────────────────────────────────────────────── */
const S = [

{
  phase: '들머리', layer: 'web/', badge: 'gray',
  title: '한 파일 안에 셋이 들어 있다',
  where: 'web/index.html · 1,373줄',
  lead: '화면은 파일 하나입니다. 그 안에 디자인(CSS)과 뼈대(HTML)와 움직임(JS)이 같이 들어 있습니다. 이 자료는 <b>디자인을 통째로 빼고</b>, 화면이 서버와 주고받는 부분만 봅니다.',
  fig: { d: svg('0 0 600 222',
      '<text class="t2" x="300" y="26">web/index.html — 1,373줄이 한 파일에 있다</text>' +
      '<rect class="b-ghost" x="20" y="42" width="240" height="62" rx="4"/>' +
      '<text class="t1" x="140" y="70">CSS  680줄</text>' +
      '<text class="t2" x="140" y="86">디자인</text>' +
      bx(276, 42, 128, 62, 'HTML  43줄', '화면의 뼈대') +
      bx(420, 42, 160, 62, 'JS  641줄', '서버와 말한다', 'on') +
      '<text class="t3" x="140" y="124">이 자료에서는 안 본다</text>' +
      '<text class="t3 b-ont" x="500" y="124">여기만 본다</text>' +
      bx(20, 148, 175, 54, 'GET', '받아서 그린다') +
      bx(212, 148, 175, 54, 'POST', '보내고 받는다') +
      bx(404, 148, 176, 54, 'PATCH · DELETE', '고치고 지운다')),
    cap: '줄 수는 지금 세어서 적은 값이다. CSS 가 이 파일의 절반이다.' },
  steps: [
    'HTML 은 <b>어디에</b> 무엇이 있는지만 정한다.',
    'JS 는 그 자리를 찾아 값을 꺼내고, 서버에 보내고, 받은 것으로 화면을 다시 그린다.',
    '이 자료는 그 <b>꺼내고 · 보내고 · 받는</b> 세 가지만 본다.'
  ],
  note: { tone: 'teal', h: '왜 CSS 를 빼도 되나',
    p: ['CSS 는 색과 크기만 정합니다. 지워도 화면은 못생겨질 뿐 <b>기능은 그대로 돕니다</b>. 서버와 주고받는 일과는 아무 상관이 없습니다.'] }
},

{
  phase: '가르기', layer: 'web/', title: '파일을 둘로 가르면',
  where: 'index.html + app.js',
  lead: '지금은 한 파일이지만, 보통은 뼈대와 움직임을 따로 둡니다. HTML 은 자리만 잡고, JS 는 파일 하나로 빠집니다.',
  fig: { d: svg('0 0 600 196',
      bx(20, 44, 200, 96, 'index.html', '1,373줄 · 전부 한 곳') +
      ar(232, 92, 288, 92, 'on', '가르면') +
      bx(300, 30, 280, 54, 'index.html', 'HTML 뼈대 + script 한 줄', 'on') +
      bx(300, 100, 280, 54, 'app.js', 'JS 641줄', 'on') +
      '<text class="t3" x="440" y="176">브라우저가 두 파일을 따로 받는다</text>'),
    cap: 'script 태그를 body 가 끝나기 직전에 두면 요소가 다 만들어진 뒤에 JS 가 돈다.' },
  code: [
    '&lt;body&gt;',
    '  &lt;input <b>id="psearch"</b>&gt;',
    '  &lt;div <b>id="prows"</b>&gt;&lt;/div&gt;',
    '',
    '  <i>&lt;script src="app.js"&gt;&lt;/script&gt;</i>',
    '&lt;/body&gt;'
  ],
  steps: [
    'HTML 에는 <b>id 와 class 만</b> 남긴다. JS 가 그 이름으로 찾는다.',
    'JS 는 <code class="k">app.js</code> 한 파일로 뺀다.',
    'script 를 맨 아래 두는 이유는 위의 요소가 다 만들어진 뒤에 JS 가 그것을 찾을 수 있게 하기 위해서다.'
  ],
  note: { tone: 'teal', h: '가르면 좋은 점',
    p: ['브라우저가 <code class="k">app.js</code> 를 따로 받아 캐시에 둡니다. HTML 만 바뀌면 JS 는 다시 안 받습니다. 그리고 파일이 짧아져 고칠 자리를 찾기 쉬워집니다.'] }
},

{
  phase: '한눈에', layer: 'web/', title: '화면이 쓰는 요청은 네 가지뿐이다',
  where: 'fetch 를 쓰는 자리 전부',
  lead: '무엇을 하느냐에 따라 <b>메서드</b>가 갈립니다. 주소는 같아도 메서드가 다르면 서버가 다른 일을 합니다.',
  fig: { d: svg('0 0 600 206',
      bx(20, 16, 116, 36, 'GET', null, 'on') +
      '<text class="t1 lft" x="152" y="39">/api/customers</text>' +
      '<text class="t2 lft" x="360" y="39">받아서 그린다</text>' +
      bx(20, 60, 116, 36, 'POST', null, 'on') +
      '<text class="t1 lft" x="152" y="83">/api/products</text>' +
      '<text class="t2 lft" x="360" y="83">만들고 받는다</text>' +
      bx(20, 104, 116, 36, 'PATCH', null, 'on') +
      '<text class="t1 lft" x="152" y="127">/api/products/P007</text>' +
      '<text class="t2 lft" x="400" y="127">고치고 받는다</text>' +
      bx(20, 148, 116, 36, 'DELETE', null, 'on') +
      '<text class="t1 lft" x="152" y="171">/api/products/P007</text>' +
      '<text class="t2 lft" x="400" y="171">지운다</text>'),
    cap: '주소가 같은 마지막 둘은 메서드만으로 갈린다.' },
  facts: { title: '보내는 것과 받는 것',
    cols: ['메서드', '보낼 몸통', '받는 것'], mono: [0],
    rows: [
      ['GET', '없다', '자료'],
      ['POST', 'JSON', '만들어진 것'],
      ['PATCH', 'JSON (준 칸만)', '고쳐진 것'],
      ['DELETE', '없다', '없다 (204)']

/* ── 그리기 ───────────────────────────────────────────────── */
function gridHtml(t) {
  const n = t.cols.length;
  const mono = t.mono || [];
  let h = '';
  if (t.title) h += '<h2>' + esc(t.title) + '</h2>';
  h += '<div class="grid" style="grid-template-columns:' +
       (n === 2 ? '1fr max-content' : '1fr max-content max-content') + '">';
  t.cols.forEach(function (c, i) {
    h += '<div class="h top' + (i ? ' bl' : '') + '">' + esc(c) + '</div>';
  });
  t.rows.forEach(function (r) {
    r.forEach(function (v, i) {
      h += '<div class="' + (mono.indexOf(i) >= 0 ? 'c ' : '') + (i ? 'bl' : '') + '">' +
           esc(v) + '</div>';
    });
  });
  return h + '</div>';
}

let cur = 0;

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];

  const fig = document.getElementById('figure');
  fig.innerHTML = s.fig.d + (s.fig.cap ? '<p class="figcap">' + s.fig.cap + '</p>' : '');

  const out = [];
  out.push('<div class="eyebrow"><span class="badge' + (s.badge === 'gray' ? ' gray' : '') +
    '">' + esc(s.layer) + '</span><span class="where">' + esc(s.where) +
    '</span><span class="step-no">' + (cur + 1) + ' / ' + S.length + '</span></div>');
  out.push('<h1>' + esc(s.title) + '</h1>');
  out.push('<p class="lead">' + s.lead + '</p>');
  if (s.code) out.push('<div class="sec"><h2>코드</h2><div class="code">' +
    s.code.join('\n') + '</div></div>');
  if (s.steps) {
    let li = '';
    s.steps.forEach(function (t, n) {
      li += '<li><span class="n">' + (n + 1) + '</span><span>' + t + '</span></li>';
    });
    out.push('<div class="sec"><h2>읽는 법</h2><ol class="steps">' + li + '</ol></div>');
  }
  if (s.note) {
    out.push('<div class="note' + (s.note.tone === 'oxide' ? ' warn' : '') + '"><h3>' +
      esc(s.note.h) + '</h3>' +
      s.note.p.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>');
  }
  if (s.facts) out.push('<div class="sec">' + gridHtml(s.facts) + '</div>');
  if (s.cap) out.push('<p class="cap">' + s.cap + '</p>');
  document.getElementById('notes-in').innerHTML = out.join('');

  document.getElementById('phase').textContent = s.phase;
  document.getElementById('at').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / S.length * 100) + '%';
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === S.length - 1;
  document.getElementById('notes').scrollTop = 0;
  fig.scrollTop = 0;

  try { localStorage.setItem('deck-webcrud', String(cur)); } catch (e) {}
}

document.getElementById('of').textContent = S.length;
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
document.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') { show(0); e.preventDefault(); }
  else if (e.key === 'End') { show(S.length - 1); e.preventDefault(); }
});

let start = 0;
try { start = Math.min(parseInt(localStorage.getItem('deck-webcrud') || '0', 10) || 0, S.length - 1); } catch (e) {}
show(start);
</script>
