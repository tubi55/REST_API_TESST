<script>
/* ── VS Code Dark+ 색을 흉내 내는 작은 파이썬 강조기 ───────── */
const PURPLE = new Set(['if','elif','else','for','while','return','try','except','finally',
  'raise','pass','break','continue','import','from','with','yield','as']);
const BLUE = new Set(['def','class','lambda','global','nonlocal','None','True','False',
  'self','and','or','not','in','is','del','assert']);
const TYPES = new Set(['str','int','float','bool','list','tuple','dict','set','Any',
  'Sequence','Mapping','Protocol','ValueError','OperationalError']);

const TOK = /(f?"""[\s\S]*?"""|f?'''[\s\S]*?'''|f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*')|(\d+\.?\d*)|([A-Za-z_]\w*)|([ \t\n]+)|([\s\S])/g;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// f 문자열은 {} 안쪽만 따로 칠한다
function pushString(out, text) {
  if (text.charAt(0) !== 'f') { out.push(['s', text]); return; }
  for (const part of text.split(/(\{[^{}]*\})/)) {
    if (part) out.push([part.charAt(0) === '{' ? 'i' : 's', part]);
  }
}

function tokenize(code) {
  const out = [];
  let prev = '', m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(code)) !== null) {
    if (m[1] !== undefined) { pushString(out, m[1]); }
    else if (m[2] !== undefined) { out.push(['n', m[2]]); }
    else if (m[3] !== undefined) {
      const word = m[3];
      let cls = 'v';
      if (prev === 'class') cls = 't';
      else if (PURPLE.has(word)) cls = 'k';
      else if (BLUE.has(word)) cls = 'b';
      else if (/^[ \t]*\(/.test(code.slice(TOK.lastIndex))) cls = 'f';
      else if (TYPES.has(word)) cls = 't';
      out.push([cls, word]);
      prev = word;
    }
    else if (m[4] !== undefined) { out.push(['w', m[4]]); }
    else { out.push(['p', m[5]]); }
  }
  return out;
}

// 토큰을 줄 단위로 나눠 그린다. 여러 줄짜리 문자열도 줄마다 span 이 닫힌다
function renderCode(code, plain) {
  const lines = [[]];
  for (const [cls, text] of (plain ? [['p', code]] : tokenize(code))) {
    const parts = text.split('\n');
    for (let i = 0; i < parts.length; i++) {
      if (i) lines.push([]);
      if (parts[i]) {
        lines[lines.length - 1].push('<span class="t-' + cls + '">' + esc(parts[i]) + '</span>');
      }
    }
  }
  while (lines.length > 1 && !lines[lines.length - 1].length) lines.pop();
  return lines.map(function (l, i) {
    return '<div class="ln" data-n="' + (i + 1) + '"><span class="num">' + (i + 1) +
      '</span><span class="src">' + (l.join('') || ' ') + '</span></div>';
  }).join('');
}

  code: `    def search(self, kind, query_vector, k, *, only_ids=None, reverse=False):
        ids, matrix, row_of = self._get(kind)
        if len(ids) == 0:
            return []
        if only_ids is None:
            target_ids, rows = ids, matrix
        else:
            target_ids = sorted(i for i in map(str, only_ids) if i in row_of)
            if not target_ids:
                return []
            rows = matrix[[row_of[i] for i in target_ids]]

        scores = rows @ query_vector
        order = np.argsort(scores if reverse else -scores, kind="stable")[:k]
        return [(target_ids[i], float(scores[i])) for i in order]`,

        payload_columns = payload_columns or {}

        key_type = next(x[2] for x in query(f"PRAGMA table_info({parent})") if x[1] == key)

        extra = "".join(
            f"    {name} {SQL_TYPE[kind_name]},\\n"

        execute(f"DROP TABLE IF EXISTS {table}")

                {key} {key_type} PRIMARY KEY,
                {extra} dim INTEGER NOT NULL,
                model       TEXT NOT NULL,
                source_hash TEXT NOT NULL,
                vector      TEXT NOT NULL,
                FOREIGN KEY ({key}) REFERENCES {parent}({key})
            )

            execute(f"CREATE INDEX idx_{table}_product_id ON {table}(product_id)")
        self._invalidate(kind)`,

  code: `    def fetch_payloads(self, kind, ids, columns):
        if not ids:

        table, key, _parent = TABLES[kind]
        known = [row[1] for row in query(f"PRAGMA table_info({table})")]
        missing = [name for name in columns if name not in known]
        if missing:

        marks = ", ".join("?" * len(ids))
        rows = query(
            f"SELECT {key}, {', '.join(columns)} FROM {table} WHERE {key} IN ({marks})",
            tuple(ids),
        )
        return {str(row[0]): dict(zip(columns, row[1:])) for row in rows}`,

function tableHtml(t) {
  const n = t.cols.length;
  const wide = n === 2 ? '' : (n === 3 ? ' three' : ' four');
  const mono = t.mono || [];
  let h = '';
  if (t.title) h += '<h2>' + esc(t.title) + '</h2>';
  h += '<div class="grid' + wide + '">';
  t.cols.forEach(function (c, i) {
    h += '<div class="h first-row' + (i ? ' bl' : '') + '">' + esc(c) + '</div>';
  });
  t.rows.forEach(function (r) {
    r.forEach(function (v, i) {
      h += '<div class="' + (mono.indexOf(i) >= 0 ? 'c ' : '') + (i ? 'bl' : '') + '">' + esc(v) + '</div>';
    });
  });
  return h + '</div>';
}

function label(spec) {
  const p = String(spec).split('-');
  return p.length > 1 ? p[0] + '–' + p[1] + '줄' : p[0] + '줄';
}

function notesHtml(s) {
  const out = [];
  const gray = (s.kind === 'set' || s.kind === 'doc') ? ' gray' : '';
  out.push('<div class="eyebrow"><span class="badge' + gray + '">' + esc(s.kind) + '</span>' +
    '<span class="where">' + esc(s.dir + s.file) + (s.src ? ' · ' + s.src + '줄' : '') + '</span></div>');
  out.push('<div class="sec"><h1>' + esc(s.name) + '</h1>' +
    '<p class="cap" style="font-family:\'IBM Plex Mono\',ui-monospace,monospace;font-size:13px">' + esc(s.sig) + '</p></div>');
  out.push('<p class="lead">' + s.lead + '</p>');

  if (s.args) {
    out.push('<div class="sec"><h2>인자</h2>' + tableHtml({
      cols: ['이름', '무엇'], mono: [0], rows: s.args
    }) + '</div>');
  }
  if (s.steps) {
    let li = '';
    s.steps.forEach(function (st) {
      li += '<li tabindex="0" data-lines="' + st[0] + '"><span class="at">' + label(st[0]) +
        '</span><span>' + st[1] + '</span></li>';
    });
    out.push('<div class="sec"><h2>하는 일</h2><ol class="steps">' + li + '</ol></div>');
  }
  if (s.ret) out.push('<div class="sec"><h2>돌려주는 것</h2><p class="lead">' + s.ret + '</p></div>');
  (s.tables || []).forEach(function (t) { out.push('<div class="sec">' + tableHtml(t) + '</div>'); });
  (s.notes || []).forEach(function (n) {
    out.push('<div class="note' + (n.tone === 'oxide' ? ' warn' : '') + '"><h3>' + esc(n.h) + '</h3>' +
      n.p.map(function (x) { return '<p>' + x + '</p>'; }).join('') + '</div>');
  });
  if (s.callers) {
    let c = '';
    s.callers.forEach(function (x) { c += '<div><code>' + esc(x[0]) + '</code><span>' + esc(x[1]) + '</span></div>'; });
    out.push('<div class="sec"><h2>부르는 곳</h2><div class="callers">' + c + '</div></div>');
  }
  if (s.cap) out.push('<p class="cap">' + s.cap + '</p>');
  return out.join('');
}

function lit(spec) {
  document.querySelectorAll('#code .ln.lit').forEach(function (n) { n.classList.remove('lit'); });
  if (!spec) return;
  const parts = String(spec).split('-').map(Number);
  const from = parts[0], to = parts.length > 1 ? parts[1] : parts[0];
  for (let n = from; n <= to; n++) {
    const row = document.querySelector('#code .ln[data-n="' + n + '"]');
    if (row) row.classList.add('lit');
  }
  const first = document.querySelector('#code .ln[data-n="' + from + '"]');
  if (first) first.scrollIntoView({ block: 'nearest' });
}

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  document.getElementById('tab-name').textContent = s.file;
  document.getElementById('tab-path').textContent = s.dir;
  document.getElementById('st-lang').textContent = s.plain ? '개요' : 'Python';
  document.getElementById('st-src').textContent = s.src ? '원본 ' + s.src + '줄' : '';
  const code = document.getElementById('code');
  code.className = 'code' + (s.plain ? ' plain' : '');
  code.innerHTML = renderCode(s.code, s.plain);
  document.getElementById('notes-in').innerHTML = notesHtml(s);
  document.getElementById('wrap').scrollTop = 0;
  document.getElementById('notes').scrollTop = 0;
  document.getElementById('at').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / S.length * 100) + '%';
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === S.length - 1;

  document.querySelectorAll('ol.steps li[data-lines]').forEach(function (el) {
    el.addEventListener('mouseenter', function () { lit(el.dataset.lines); });
    el.addEventListener('mouseleave', function () { lit(''); });
    el.addEventListener('focus', function () { lit(el.dataset.lines); });
    el.addEventListener('blur', function () { lit(''); });
  });

  try { localStorage.setItem('deck-stores', String(cur)); } catch (e) {}
}

document.getElementById('of').textContent = S.length;
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
document.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') { show(0); e.preventDefault(); }
  else if (e.key === 'End') { show(S.length - 1); e.preventDefault(); }
});

let start = 0;
try { start = Math.min(parseInt(localStorage.getItem('deck-stores') || '0', 10) || 0, S.length - 1); } catch (e) {}
show(start);
</script>
