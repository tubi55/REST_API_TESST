<title>맞게 도는지 재는 자리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper:#F1F3F4; --card:#FBFCFC; --ink:#17212B; --muted:#5A6672;
  --rule:#D3D9DD; --rule-soft:#E4E9EB;
  --oxide:#B4501E; --oxide-soft:#F5E6DC;
  --teal:#16697A; --teal-soft:#DDEBED;
  --shadow:0 1px 2px rgba(23,33,43,.06), 0 8px 24px rgba(23,33,43,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
    --rule:#2C3842; --rule-soft:#232E37;
    --oxide:#E08A55; --oxide-soft:#3A2418;
    --teal:#63B0C0; --teal-soft:#16303A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"] {
  --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
  --rule:#2C3842; --rule-soft:#232E37;
  --oxide:#E08A55; --oxide-soft:#3A2418;
  --teal:#63B0C0; --teal-soft:#16303A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
.deck { position:relative; min-height:100vh; }

.rail {
  position:fixed; left:0; top:0; bottom:0; width:56px; z-index:5;
  border-right:1px solid var(--rule-soft); background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:20px 0;
}
.rail-ch { writing-mode:vertical-rl; font-size:12.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); font-weight:500; }
.rail-no { font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted);
  font-variant-numeric:tabular-nums; }

/* 표와 구조표가 넓게 눕도록 슬라이드 폭을 크게 잡는다.
   줄글은 아래에서 max-width 로 따로 묶으니 같이 늘어나지 않는다 */
.stage { min-height:100vh; padding:48px 44px 84px 84px;
  display:flex; flex-direction:column; justify-content:flex-start; }
.slide { display:none; max-width:88rem; width:100%; }
/* margin:auto 가 자리가 남으면 가운데로, 넘치면 위부터 놓는다 */
.slide.on { margin:auto; }
.slide.on { display:block; animation:rise .3s ease-out; }
@keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .slide.on { animation:none; } }

.eyebrow { font-size:14px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); font-weight:600; margin-bottom:16px; }
.eyebrow.pain { color:var(--oxide); }
.eyebrow.build { color:var(--teal); }

h1 { font-family:"Gowun Batang",serif; font-weight:700; font-size:clamp(2.5rem,5.6vw,4rem);
  line-height:1.28; margin:0 0 20px; text-wrap:balance; letter-spacing:-.01em; }
h2 { font-family:"Gowun Batang",serif; font-weight:700; font-size:clamp(1.75rem,3.4vw,2.45rem);
  line-height:1.35; margin:0 0 16px; text-wrap:balance; max-width:32ch; }
h3 { font-size:1.18rem; font-weight:600; margin:0 0 8px; }
p { margin:0 0 16px; max-width:60ch; font-size:1.2rem; }
p.lead { font-size:1.34rem; color:var(--muted); max-width:56ch; }
p.sub { font-size:1.04rem; color:var(--muted); }
strong { font-weight:600; }
em { font-style:normal; color:var(--oxide); font-weight:500; }
b.t { color:var(--teal); font-weight:600; }

.cover { border-top:3px solid var(--ink); padding-top:26px; }
.cover .num { font-family:"IBM Plex Mono",monospace; font-size:4rem; line-height:1;
  color:var(--rule); font-weight:500; margin-bottom:14px; }

.statement { font-family:"Gowun Batang",serif; font-size:clamp(2.05rem,4.6vw,3.15rem);
  line-height:1.45; text-wrap:balance; max-width:24ch; margin:0; }

.cards { display:grid; gap:14px; margin:0 0 16px; max-width:76rem; }
.cards.two { grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.cards.three { grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); }
.card { background:var(--card); border:1px solid var(--rule-soft); border-radius:3px;
  padding:16px 18px; box-shadow:var(--shadow); }
.card p { margin:0; font-size:1.06rem; color:var(--muted); }
.card .k { font-family:"IBM Plex Mono",monospace; font-size:.92rem; color:var(--muted);
  letter-spacing:.06em; margin-bottom:6px; }

.acc { border-left:3px solid var(--oxide); background:var(--oxide-soft);
  padding:16px 20px; border-radius:0 3px 3px 0; margin:0 0 14px; max-width:72rem; }
.acc h3 { color:var(--oxide); }
.acc p { margin:0; max-width:64ch; }
.fix { border-left:3px solid var(--teal); background:var(--teal-soft);
  padding:16px 20px; border-radius:0 3px 3px 0; margin:0 0 14px; max-width:72rem; }
.fix h3 { color:var(--teal); }
.fix p { margin:0; max-width:64ch; }

.strata { border:1px solid var(--rule); border-radius:3px; overflow:hidden;
  margin:0 0 16px; max-width:68rem; background:var(--card);
  display:grid; grid-template-columns:max-content minmax(0,1fr); }
.strata > div { border-bottom:1px solid var(--rule-soft); padding:13px 18px; }
.strata > div:nth-last-child(-n+2) { border-bottom:0; }
.band-n { font-family:"IBM Plex Mono",monospace; font-size:1.02rem; font-weight:500;
  white-space:nowrap; }
.band-d { font-size:1.04rem; color:var(--muted); border-left:1px solid var(--rule-soft); }
.strata .hi { background:var(--teal-soft); }
.strata .band-n.hi { color:var(--teal); }

.flow { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 18px; }
.step { background:var(--card); border:1px solid var(--rule); border-radius:3px;
  padding:11px 16px; font-family:"IBM Plex Mono",monospace; font-size:1rem; }
.step.on { border-color:var(--teal); color:var(--teal); background:var(--teal-soft); }
.arrow { color:var(--muted); }

pre { background:var(--card); border:1px solid var(--rule-soft);
  border-left:3px solid var(--teal); border-radius:0 3px 3px 0;
  padding:14px 18px; overflow-x:auto; margin:0 0 12px; max-width:76rem; }
code { font-family:"IBM Plex Mono",monospace; font-size:1rem; line-height:1.8; }
pre.bad { border-left-color:var(--oxide); }
.cap { font-size:1.02rem; color:var(--muted); margin:0 0 18px; }

.qa { border:1px solid var(--rule); border-left:3px solid var(--ink);
  border-radius:0 3px 3px 0; padding:18px 22px; margin:0 0 16px; background:var(--card);
  max-width:76rem; }
.qa .q { display:flex; gap:12px; margin-bottom:12px; }
.qa .a { display:flex; gap:12px; margin-bottom:14px; }
.qa .mk { font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--muted);
  flex:0 0 1.4em; font-size:1.1rem; }
.qa .q p, .qa .a p { margin:0; font-size:1.12rem; max-width:70ch; }
.qa .q p { font-weight:600; }
.qa .meta { border-top:1px solid var(--rule-soft); padding-top:12px;
  display:flex; flex-direction:column; gap:6px; }
.qa .meta div { font-size:1rem; color:var(--muted); }
.qa .meta b { font-family:"IBM Plex Mono",monospace; font-size:.85rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-right:10px; font-weight:600; }
.qa .meta .tail { color:var(--teal); }
.qa .do { margin-top:14px; border-top:1px dashed var(--teal); padding-top:14px; }
.qa .do .k { font-family:"IBM Plex Mono",monospace; font-size:.85rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--teal); font-weight:600; margin-bottom:8px; }
.qa .do p { margin:0; font-size:1.04rem; color:var(--ink); max-width:70ch; }

/* 폴더 트리.
   세로선을 │ 글자로 그리면 줄 사이가 뚫린다. 글자는 줄 높이를 안 채우기 때문이다.
   그래서 선은 CSS 의 border-left 로 그린다. 그러면 끊기지 않는다. */
.tree { border:1px solid var(--rule); border-radius:3px; margin:0 0 20px;
  background:var(--card); padding:14px 0; max-width:68rem;
  display:grid; grid-template-columns:max-content minmax(0,1fr); }
.tree .t { font-family:"IBM Plex Mono",monospace; font-size:1.04rem; font-weight:500;
  color:var(--teal); white-space:nowrap; padding:6px 28px 6px 24px; }
.tree .d { font-size:1.02rem; color:var(--muted); padding:6px 24px 6px 0; }
.tree .root { grid-column:1 / -1; font-family:"IBM Plex Mono",monospace; font-size:1.06rem;
  font-weight:600; color:var(--ink); padding:7px 24px; }
.tree .hi { background:var(--teal-soft); }
.tree .t.hi { font-weight:700; }

/* 파일 구조표.
   왼쪽 배지가 '무엇인가'(설명글 · import · 설정값 · 함수 · 실행문),
   가운데가 코드에 그대로 있는 이름, 오른쪽이 그게 하는 일이다.

   칸 사이에 세로선을 긋는다. 격자에 gap 을 주면 선이 못 붙으니 gap 을 0 으로 두고
   칸마다 padding 을 준 뒤 border-left 로 긋는다. 격자 칸은 세로로 늘어나므로
   선이 줄 높이를 다 채운다.

   가운데 칸은 절대 줄바꿈하지 않는다. 함수 이름이 중간에서 끊기면 못 읽는다.
   그래서 max-content 로 잡고 nowrap 을 건다. 창이 좁으면 표가 가로로 밀린다.

   배지 색은 두 가지만 쓴다. 청록은 정의(불러야 도는 것),
   먹색은 실행문(파일을 열면 바로 도는 것). 나머지는 회색이다. */
.anat { border:1px solid var(--rule); border-radius:3px; background:var(--card);
  margin:0 0 14px; overflow-x:auto; }
.anat .hd { display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:space-between;
  align-items:baseline; padding:11px 18px; background:var(--paper);
  border-bottom:1px solid var(--rule); }
.anat .hd .f { font-family:"IBM Plex Mono",monospace; font-size:1.06rem; font-weight:600;
  color:var(--ink); white-space:nowrap; }
.anat .hd .m { font-size:.98rem; color:var(--muted); }
/* 표 전체가 격자 하나다. 줄마다 격자를 따로 만들면 칸 너비가 줄마다 따로 정해져
   세로선이 지그재그가 된다. 그래서 셀을 전부 한 격자에 넣는다 */
.anat .rows { display:grid; grid-template-columns:max-content max-content minmax(18rem,1fr); }
.anat .rows > div { border-bottom:1px solid var(--rule-soft); }
.anat .rows > div:nth-last-child(-n+3) { border-bottom:0; }
.anat .c-g { padding:10px 16px 10px 18px; }
.anat .c-g .g { display:block; font-size:.76rem; letter-spacing:.04em; font-weight:600;
  border-radius:2px; padding:2px 8px; text-align:center; white-space:nowrap; }
.g-doc, .g-imp, .g-set { color:var(--muted); background:var(--rule-soft); }
.g-fn, .g-cls { color:var(--teal); background:var(--teal-soft); }
.g-run { color:var(--paper); background:var(--ink); }
.anat .c-n { font-family:"IBM Plex Mono",monospace; font-size:1rem; color:var(--ink);
  white-space:nowrap; padding:10px 20px; border-left:1px solid var(--rule-soft); }
.anat .c-d { font-size:1rem; color:var(--muted);
  padding:10px 20px; border-left:1px solid var(--rule-soft); }

/* 들어오는 것 · 하는 일 · 나가는 것.
   파일마다 같은 자리에 같은 모양으로 나오게 해서 서로 견줄 수 있게 한다 */
.io { display:grid; grid-template-columns:1fr 2rem 1.15fr 2rem 1fr;
  align-items:stretch; margin:0 0 18px; max-width:80rem; }
.io .box { border:1px solid var(--rule); border-radius:3px; background:var(--card);
  padding:14px 18px; }
.io .box.mid { border-color:var(--teal); background:var(--teal-soft); }
.io .k { font-size:.78rem; letter-spacing:.1em; color:var(--muted); font-weight:600;
  margin-bottom:8px; }
.io .box.mid .k { color:var(--teal); }
.io ul { margin:0; padding-left:1.05rem; }
.io li { font-size:1.02rem; margin-bottom:3px; max-width:none; }
.io p { margin:0; font-size:1.06rem; max-width:none; }
.io .ar { display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:1.3rem; }

/* 실행 구간이 어떤 함수를 부르는가 */
.calls { border:1px solid var(--rule); border-radius:3px; background:var(--card);
  margin:0 0 16px; max-width:84rem; }
.calls { display:grid; grid-template-columns:max-content minmax(0,1fr); }
.calls > div { border-bottom:1px solid var(--rule-soft); }
.calls > div:nth-last-child(-n+2) { border-bottom:0; }
.calls .s { padding:12px 18px; }
.calls .s b { display:block; font-size:1.04rem; font-weight:600; }
.calls .s span { display:block; font-size:.96rem; color:var(--muted); }
.calls .fns { padding:14px 18px; border-left:1px solid var(--rule-soft);
  display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start; }
.calls .none { font-size:1rem; color:var(--muted); }
.fn { font-family:"IBM Plex Mono",monospace; font-size:.95rem; color:var(--teal);
  background:var(--teal-soft); border:1px solid var(--teal); border-radius:2px;
  padding:1px 9px; white-space:nowrap; height:max-content; }

/* 함수를 역할별로 묶어 보여 준다 */
.groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
  gap:14px; margin:0 0 16px; max-width:84rem; }
.groups .gr { border:1px solid var(--rule-soft); border-radius:3px; background:var(--card);
  padding:15px 17px; box-shadow:var(--shadow); }
.groups h3 { font-size:1.06rem; margin-bottom:10px; }
.groups .fns { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.groups p { margin:0; font-size:1.02rem; color:var(--muted); max-width:none; }

/* 낱말 풀이. 표처럼 줄만 긋는다 */
.terms { border-top:1px solid var(--rule); margin:0 0 18px; max-width:72rem;
  display:grid; grid-template-columns:max-content minmax(0,1fr); }
.terms > div { border-bottom:1px solid var(--rule-soft); padding:11px 0; }
.terms .k { font-family:"IBM Plex Mono",monospace; font-size:1.02rem; font-weight:500;
  color:var(--teal); white-space:nowrap; padding-right:28px; }
.terms .p { font-size:1.04rem; color:var(--muted); max-width:64ch; }

/* 함수 슬라이드. 제목이 곧 함수 이름이다 */
h2.fn-title { font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:clamp(1.5rem,2.8vw,2.05rem); letter-spacing:-.01em; max-width:none; }
.sig { border:1px solid var(--rule); border-radius:3px; background:var(--card);
  margin:0 0 18px; max-width:80rem;
  display:grid; grid-template-columns:max-content max-content minmax(0,1fr); }
.sig > div { border-bottom:1px solid var(--rule-soft); padding:11px 20px; }
.sig > div:nth-last-child(-n+3) { border-bottom:0; }
.sig .k { font-size:.82rem; letter-spacing:.08em; color:var(--muted); font-weight:600;
  white-space:nowrap; }
.sig .v { font-family:"IBM Plex Mono",monospace; font-size:1rem; color:var(--ink);
  white-space:nowrap; border-left:1px solid var(--rule-soft); }
.sig .d { font-size:1.02rem; color:var(--muted); border-left:1px solid var(--rule-soft); }

/* 배우고 나면 할 수 있는 것 */
.goals { margin:0 0 18px; max-width:72rem; border-top:1px solid var(--rule); }
.goals .go { display:grid; grid-template-columns:2.4rem minmax(0,1fr); gap:16px;
  padding:13px 0; border-bottom:1px solid var(--rule-soft); align-items:baseline; }
.goals .no { font-family:"IBM Plex Mono",monospace; color:var(--teal); font-weight:600;
  font-size:1.04rem; }
.goals .tx { font-size:1.14rem; }

.fig { margin:0 0 20px; max-width:84rem; }
.fig svg { width:100%; height:auto; display:block; }
.fig svg text { font-family:"IBM Plex Sans KR",sans-serif; }
.fig svg .m { font-family:"IBM Plex Mono",monospace; }

.vs { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:20px;
  margin:0 0 16px; max-width:76rem; }

table { border-collapse:collapse; width:100%; font-size:1.04rem; }
th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--rule-soft);
  vertical-align:top; }
th { font-size:.86rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
th + th, td + td { border-left:1px solid var(--rule-soft); }
td.n { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; }
.scroll { overflow-x:auto; margin:0 0 16px; max-width:84rem; }

.drill { border:1px dashed var(--teal); border-radius:3px; padding:18px 20px;
  background:var(--teal-soft); margin:0 0 14px; max-width:72rem; }
.drill .k { font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--teal); font-weight:600; margin-bottom:8px; }
.drill p { margin:0; max-width:64ch; }
.drill pre { background:var(--card); }

ul { margin:0 0 14px; padding-left:1.1rem; }
li { margin-bottom:8px; font-size:1.14rem; max-width:60ch; }
li::marker { color:var(--muted); }

.bar { position:fixed; left:56px; right:0; bottom:0; height:44px; background:var(--paper);
  border-top:1px solid var(--rule-soft); display:flex; align-items:center;
  justify-content:space-between; padding:0 20px; font-size:13px; color:var(--muted); z-index:5; }
.bar button { font:inherit; color:var(--muted); background:none; border:1px solid var(--rule);
  border-radius:3px; padding:3px 10px; cursor:pointer; }
.bar button:hover { color:var(--ink); border-color:var(--muted); }
.bar button:focus-visible, .idx li:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
.prog { position:fixed; left:56px; right:0; bottom:44px; height:2px; background:var(--rule-soft); z-index:5; }
.prog i { display:block; height:100%; background:var(--teal); transition:width .25s ease; }

.idx { position:fixed; inset:0; background:var(--paper); z-index:20; padding:40px 40px 40px 84px;
  overflow-y:auto; display:none; }
.idx.on { display:block; }
.idx ol { list-style:none; padding:0; margin:0; max-width:76rem; columns:2; column-gap:36px; }
.idx li { break-inside:avoid; padding:7px 0; border-bottom:1px solid var(--rule-soft);
  cursor:pointer; font-size:1.02rem; display:flex; gap:12px; }
.idx li:hover { color:var(--teal); }
.idx li span { font-family:"IBM Plex Mono",monospace; color:var(--muted); font-size:.95rem; min-width:2.4em; }
.idx li.ch { font-weight:600; border-bottom-color:var(--rule); }

@media (max-width:1100px) {
  .anat .rows { grid-template-columns:max-content max-content minmax(13rem,1fr); }
}
@media (max-width:820px) {
  .io { grid-template-columns:1fr; gap:10px; }
  .io .ar { transform:rotate(90deg); }
  .calls { grid-template-columns:minmax(0,1fr); }
  .calls .fns { border-left:0; }
}
@media (max-width:760px) {
  .rail { display:none; }
  .stage { padding:32px 20px 80px; }
  .bar, .prog { left:0; }
  .idx { padding:32px 20px; }
  .anat { font-size:.94rem; }
  .terms, .sig { grid-template-columns:minmax(0,1fr); }
  .terms > div, .sig > div { border-left:0; }
  .idx ol { columns:1; }
}
</style>

<div class="deck">
  <div class="rail">
    <div class="rail-ch">e5 tests · eval</div>
    <div class="rail-no" id="railno">1</div>
  </div>
  <div class="stage" id="stage"></div>

const stage = document.getElementById('stage');

function chips(names) {
  return names.map(function (n) { return '<span class="fn">' + n + '</span>'; }).join('');
}

function block(b) {
  if (b.p) return '<p>' + b.p + '</p>';
  if (b.code) return '<pre class="' + (b.bad ? 'bad' : '') + '"><code>' + b.code + '</code></pre>'
    + (b.cap ? '<p class="cap">' + b.cap + '</p>' : '');
  if (b.acc) return '<div class="acc"><h3>' + b.acc + '</h3><p>' + b.body + '</p></div>';
  if (b.fix) return '<div class="fix"><h3>' + b.fix + '</h3><p>' + b.body + '</p></div>';
  if (b.strata) return '<div class="strata">' + b.strata.map(function (r) {
    var hi = r.hi ? ' hi' : '';
    return '<div class="band-n' + hi + '">' + r.n + '</div>'
      + '<div class="band-d' + hi + '">' + r.d + '</div>';
  }).join('') + '</div>';
  if (b.flow) return '<div class="flow">' + b.flow.map(function (f, i) {
    return (i ? '<span class="arrow">&rarr;</span>' : '')
      + '<span class="step ' + (f.on ? 'on' : '') + '">' + f.t + '</span>';
  }).join('') + '</div>';
  if (b.cards) return '<div class="cards ' + (b.cards.length > 2 ? 'three' : 'two') + '">'
    + b.cards.map(function (c) {
      return '<div class="card">' + (c.k ? '<div class="k">' + c.k + '</div>' : '')
        + (c.h ? '<h3>' + c.h + '</h3>' : '') + '<p>' + c.p + '</p></div>';
    }).join('') + '</div>';
  if (b.vs) return '<div class="vs">' + b.vs.map(function (v) {
    return '<div><div class="eyebrow ' + (v.tone || '') + '">' + v.k + '</div>'
      + (v.code ? '<pre class="' + (v.tone === 'pain' ? 'bad' : '') + '"><code>' + v.code + '</code></pre>' : '')
      + '<p class="sub">' + v.p + '</p></div>';
  }).join('') + '</div>';
  if (b.table) return '<div class="scroll"><table><thead><tr>'
    + b.table.head.map(function (x) { return '<th>' + x + '</th>'; }).join('')
    + '</tr></thead><tbody>' + b.table.rows.map(function (r) {
      return '<tr>' + r.map(function (c, i) {
        var num = i > 0 && /^[0-9$.,%~+→-]+$/.test(String(c));
        return '<td class="' + (num ? 'n' : '') + '">' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  if (b.qa) return '<div class="qa">'
    + '<div class="q"><span class="mk">Q.</span><p>' + b.qa + '</p></div>'
    + '<div class="a"><span class="mk">A.</span><p>' + b.a + '</p></div>'
    + '<div class="meta"><div><b>근거</b>' + b.src + '</div>'
    + (b.tail ? '<div class="tail"><b>꼬리</b>' + b.tail + '</div>' : '')
    + '</div>'
    + (b.do ? '<div class="do"><div class="k">이렇게 해 두세요</div><p>' + b.do + '</p></div>' : '')
    + '</div>';
  if (b.tree) return '<div class="tree">' + b.tree.map(function (r) {
    if (r.root) return '<div class="root">' + r.t + '</div>';
    var hi = r.hi ? ' hi' : '';
    return '<div class="t' + hi + '">' + r.t + '</div>'
      + '<div class="d' + hi + '">' + (r.d || '') + '</div>';
  }).join('') + '</div>';
  /* 파일 구조표. 배지 · 코드에 있는 이름 · 하는 일 */
  if (b.anat) {
    var LABEL = { doc: '설명글', imp: 'import', set: '설정값', fn: '함수', cls: '클래스', run: '실행문' };
    return '<div class="anat"><div class="hd"><div class="f">' + b.anat.file + '</div>'
      + '<div class="m">' + (b.anat.meta || '') + '</div></div>'
      + '<div class="rows">' + b.anat.rows.map(function (r) {
        return '<div class="c-g"><span class="g g-' + r.g + '">' + (LABEL[r.g] || r.g) + '</span></div>'
          + '<div class="c-n">' + r.n + '</div>'
          + '<div class="c-d">' + (r.d || '') + '</div>';
      }).join('') + '</div></div>';
  }
  /* 들어오는 것 · 하는 일 · 나가는 것 */
  if (b.io) return '<div class="io">'
    + '<div class="box"><div class="k">들어오는 것</div><ul>'
    + b.io.in.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'
    + '<div class="ar">&rarr;</div>'
    + '<div class="box mid"><div class="k">하는 일</div><p>' + b.io.does + '</p></div>'
    + '<div class="ar">&rarr;</div>'
    + '<div class="box"><div class="k">나가는 것</div><ul>'
    + b.io.out.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'
    + '</div>';
  /* 실행 구간이 어떤 함수를 부르나 */
  if (b.calls) return '<div class="calls">' + b.calls.map(function (c) {
    return '<div class="s"><b>' + c.s + '</b>'
      + (c.d ? '<span>' + c.d + '</span>' : '') + '</div>'
      + '<div class="fns">'
      + (c.fns.length ? chips(c.fns) : '<span class="none">부르는 함수 없음</span>')
      + '</div>';
  }).join('') + '</div>';
  /* 함수를 역할별로 묶어 보여 준다 */
  if (b.groups) return '<div class="groups">' + b.groups.map(function (g) {
    return '<div class="gr"><h3>' + g.h + '</h3>'
      + '<div class="fns">' + chips(g.fns) + '</div><p>' + g.p + '</p></div>';
  }).join('') + '</div>';
  if (b.goals) return '<div class="goals">' + b.goals.map(function (g) {
    return '<div class="go"><div class="no">' + g.n + '</div><div class="tx">' + g.t + '</div></div>';
  }).join('') + '</div>';
  /* 함수가 무엇을 받아 무엇을 돌려주나 */
  if (b.sig) {
    var rows = [];
    if (b.sig.in && b.sig.in.length) {
      b.sig.in.forEach(function (x, i) {
        rows.push([i ? '' : '받는 것', x[0], x[1]]);
      });
    } else {
      rows.push(['받는 것', '없음', '인자를 받지 않습니다']);
    }
    b.sig.out.forEach(function (x, i) { rows.push([i ? '' : '돌려주는 것', x[0], x[1]]); });
    return '<div class="sig">' + rows.map(function (r) {
      return '<div class="k">' + r[0] + '</div><div class="v">' + r[1]
        + '</div><div class="d">' + r[2] + '</div>';
    }).join('') + '</div>';
  }
  if (b.terms) return '<div class="terms">' + b.terms.map(function (t) {
    return '<div class="k">' + t.k + '</div><div class="p">' + t.p + '</div>';
  }).join('') + '</div>';
  if (b.fig) return '<div class="fig">' + b.fig + '</div>'
    + (b.cap ? '<p class="cap">' + b.cap + '</p>' : '');
  if (b.list) return '<ul>' + b.list.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  if (b.drill) return '<div class="drill"><div class="k">실습</div><h3>' + b.drill + '</h3>'
    + (b.code ? '<pre><code>' + b.code + '</code></pre>' : '') + '<p>' + b.body + '</p></div>';
  return '';
}

function render(s) {
  const el = document.createElement('section');
  el.className = 'slide';
  el.setAttribute('aria-hidden', 'true');
  let h = '';
  if (s.eyebrow) h += '<div class="eyebrow ' + (s.tone || '') + '">' + s.eyebrow + '</div>';
  if (s.layout === 'cover') {
    h += '<div class="cover"><div class="num">' + s.num + '</div><h1>' + s.title + '</h1>'
      + (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') + '</div>';
  } else if (s.layout === 'statement') {
    h += '<p class="statement">' + s.text + '</p>'
      + (s.sub ? '<p class="sub" style="margin-top:22px">' + s.sub + '</p>' : '');
  } else {
    if (s.title) h += '<h2' + (s.kind === 'fn' ? ' class="fn-title"' : '') + '>' + s.title + '</h2>';
    if (s.lead) h += '<p class="lead">' + s.lead + '</p>';
    (s.blocks || []).forEach(function (b) { h += block(b); });
  }
  el.innerHTML = h;
  return el;
}

const nodes = S.map(render);
nodes.forEach(function (n) { stage.appendChild(n); });

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  nodes.forEach(function (n, j) {
    n.classList.toggle('on', j === cur);
    n.setAttribute('aria-hidden', j === cur ? 'false' : 'true');
  });
  prog.style.width = ((cur + 1) / S.length * 100) + '%';
  railno.textContent = cur + 1;
  count.textContent = (cur + 1) + ' / ' + S.length;
  try { localStorage.setItem('deck-e5', String(cur)); } catch (e) {}
}

document.getElementById('idxlist').innerHTML = S.map(function (s, i) {
  return '<li tabindex="0" data-i="' + i + '" class="' + (s.layout === 'cover' ? 'ch' : '') + '">'
    + '<span>' + (i + 1) + '</span>' + (s.title || s.text || '') + '</li>';
}).join('');
document.getElementById('idxlist').addEventListener('click', function (e) {
  const li = e.target.closest('li'); if (!li) return;
  show(+li.dataset.i); idx.classList.remove('on');
});
document.getElementById('idxlist').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const li = e.target.closest('li'); if (!li) return;
  show(+li.dataset.i); idx.classList.remove('on');
});
document.getElementById('idxbtn').addEventListener('click', function () { idx.classList.toggle('on'); });

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(S.length - 1);
  if (e.key.toLowerCase() === 'm') idx.classList.toggle('on');
  if (e.key === 'Escape') idx.classList.remove('on');
});

let start = 0;
try { start = Math.min(parseInt(localStorage.getItem('deck-e5') || '0', 10) || 0, S.length - 1); } catch (e) {}
show(start);
</script>
