<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
    --rule:#2C3842; --rule-soft:#232E37; --chip:#232E37; --grid:#1E2831;
    --oxide:#E08A55; --oxide-soft:#3A2418;
    --teal:#63B0C0; --teal-soft:#16303A;

}
:root[data-theme="dark"] {
  --paper:#131A20; --card:#1B242C; --ink:#E4E9EC; --muted:#93A1AC;
  --rule:#2C3842; --rule-soft:#232E37; --chip:#232E37; --grid:#1E2831;

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  line-height:1.72; -webkit-font-smoothing:antialiased;
}
:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

.deck { height:100%; display:flex; flex-direction:column; }

.bar {
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  padding:0 20px; height:50px;
  background:var(--card); border-bottom:1px solid var(--rule);
}
.mark {
  font-family:"Gowun Batang", Georgia, serif; font-weight:700; font-size:17px;
  white-space:nowrap; letter-spacing:-.015em;
}
.mark span { color:var(--teal); }
.bar .spacer { flex:1; }
.phase {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.count {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px;
  color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.count b { color:var(--ink); font-weight:500; }
.nav-btn {
  width:34px; height:28px; border:1px solid var(--rule); border-radius:4px;
  background:transparent; color:var(--ink); cursor:pointer;
  font-size:14.5px; line-height:1; display:grid; place-items:center;
}
.nav-btn:hover { background:var(--chip); }
.nav-btn:disabled { opacity:.32; cursor:default; }
.track { flex:0 0 auto; height:2px; background:var(--rule-soft); }
.track i { display:block; height:100%; background:var(--teal); transition:width .2s ease; }

.split { flex:1; min-height:0; display:grid; grid-template-columns:60% 40%; }

.figure {
  min-width:0; overflow:auto; padding:26px 24px 32px;
  display:flex; flex-direction:column; align-items:center;
  /* safe center 라야 그림이 칸보다 클 때 위쪽이 안 잘린다 */
  justify-content:center; justify-content:safe center;
  gap:14px; border-right:1px solid var(--rule);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
}
.figure svg { width:100%; max-width:750px; height:auto; display:block; flex:0 0 auto; }
.figcap {
  font-size:13.5px; color:var(--muted); text-align:center; max-width:700px;
  background:var(--paper); padding:2px 10px; border-radius:3px; flex:0 0 auto;
}

/* 그림 안의 공통 조각 */
.b-off  { fill:var(--card); stroke:var(--rule); stroke-width:1; }
.b-on   { fill:var(--teal-soft); stroke:var(--teal); stroke-width:1.6; }
.b-warn { fill:var(--oxide-soft); stroke:var(--oxide); stroke-width:1.6; }
.b-ghost{ fill:none; stroke:var(--rule); stroke-width:1; stroke-dasharray:3 3; }
.t1 { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12.5px;

.t2 { font-family:"IBM Plex Sans KR", sans-serif; font-size:11px;
      fill:var(--muted); text-anchor:middle; }
.t3 { font-family:"IBM Plex Sans KR", sans-serif; font-size:11px;

.b-ont { fill:var(--teal); }
.b-warnt { fill:var(--oxide); }
.lft { text-anchor:start; }
.rgt { text-anchor:end; }
.ar { stroke:var(--muted); stroke-width:1.4; fill:none; }
.ar-on { stroke:var(--teal); stroke-width:2; fill:none; }

.badge {

.chain {

ol.steps { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
ol.steps li {

ol.steps li .n {

.note {

.grid {

.grid > div.top { border-top:0; }
.grid .bl { border-left:1px solid var(--rule-soft); }
.grid .h {

  letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  background:var(--chip); white-space:nowrap;
}
.grid .c {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:13px;
  white-space:nowrap; color:var(--teal); font-variant-numeric:tabular-nums;

code.k {
  font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:.88em;
  background:var(--chip); padding:1px 6px; border-radius:3px;
}
.cap { font-size:13px; color:var(--muted); margin:0; }

/* 좁아지면 위아래로 쌓고 페이지 전체가 세로로 스크롤되게 둔다 */

@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

<script>
/* ── 그림 조각 ─────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function svg(vb, body) {
  return '<svg viewBox="' + vb + '" role="img">' + body + '</svg>';
}

// 상자 하나. tone 은 on(청록) · off(회색) · warn(주황) 이다
function bx(x, y, w, h, title, sub, tone) {
  const t = tone || 'off';
  const cx = x + w / 2;
  let s = '<rect class="b-' + t + '" x="' + x + '" y="' + y + '" width="' + w +
          '" height="' + h + '" rx="4"/>';
  const tint = t === 'on' ? ' b-ont' : (t === 'warn' ? ' b-warnt' : '');
  if (sub) {
    s += '<text class="t1' + tint + '" x="' + cx + '" y="' + (y + h / 2 - 3) + '">' + title + '</text>';
    s += '<text class="t2" x="' + cx + '" y="' + (y + h / 2 + 13) + '">' + sub + '</text>';
  } else {
    s += '<text class="t1' + tint + '" x="' + cx + '" y="' + (y + h / 2 + 5) + '">' + title + '</text>';
  }
  return s;
}

// 화살표 하나. 곧게 긋고 끝에 삼각형을 붙인다
function ar(x1, y1, x2, y2, tone, label) {
  const t = tone || '';
  const cls = t ? 'ar-' + t : 'ar';
  const hcls = t ? 'arh-' + t : 'arh';
  const a = Math.atan2(y2 - y1, x2 - x1);
  const px = (ang) => (x2 - 10 * Math.cos(a + ang)) + ',' + (y2 - 10 * Math.sin(a + ang));
  let s = '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' +
          (x2 - 6 * Math.cos(a)) + '" y2="' + (y2 - 6 * Math.sin(a)) + '"/>';
  s += '<polygon class="' + hcls + '" points="' + x2 + ',' + y2 + ' ' + px(0.38) + ' ' + px(-0.38) + '"/>';
  if (label) {
    // 이름표를 선에 수직으로 밀어낸다. 안 그러면 비스듬한 화살표를 타고 앉는다
    let nx = Math.sin(a), ny = -Math.cos(a);
    if (ny > 0) { nx = -nx; ny = -ny; }
    s += '<text class="t3" x="' + ((x1 + x2) / 2 + nx * 15) + '" y="' +
         ((y1 + y2) / 2 + ny * 15 + 4) + '">' + label + '</text>';
  }
  return s;
}

/* ── 여섯 층 지도. 이 요청이 지금 어느 층에 있는지 켠다 ────── */
const BANDS = [
  { id: 'web', name: 'web/index.html', role: '화면 한 장' },
  { id: 'api', name: 'app/api/', role: '문지기 · 흐름 · 응답' },
  { id: 'feat', name: 'app/features/', role: '조립' },
  { cols: [
    { id: 'dom', name: 'app/domain/', role: '순수 계산' },
    { id: 'repo', name: 'app/repositories/', role: 'SQL' },
    { id: 'ada', name: 'app/adapters/', role: '벡터 · LLM' },
  ] },
  { id: 'core', name: 'app/core/', role: '설정 · DB · 임베딩기 · 관측' },
  { id: 'out', name: 'SQLite · LLM 서버', role: '바깥' },
];

const BW = 560, BH = 44, BSTEP = 54;

function rowOf(id) {
  for (let i = 0; i < BANDS.length; i++) {
    if (BANDS[i].id === id) return i;
    if (BANDS[i].cols && BANDS[i].cols.some(function (c) { return c.id === id; })) return i;
  }
  return 0;
}

function stack(lit, hops) {
  const on = new Set(lit || []);
  let s = '';
  BANDS.forEach(function (b, i) {
    const y = i * BSTEP;
    if (b.cols) {
      const w = (BW - 20) / 3;
      b.cols.forEach(function (c, j) {
        const x = j * (w + 10);
        const t = on.has(c.id) ? 'on' : 'off';
        s += '<rect class="b-' + t + '" x="' + x + '" y="' + y + '" width="' + w +
             '" height="' + BH + '" rx="4"/>';
        s += '<text class="t1' + (t === 'on' ? ' b-ont' : '') + '" x="' + (x + w / 2) +
             '" y="' + (y + 19) + '">' + c.name + '</text>';
        s += '<text class="t2" x="' + (x + w / 2) + '" y="' + (y + 34) + '">' + c.role + '</text>';
      });
    } else {
      const t = on.has(b.id) ? 'on' : 'off';
      s += '<rect class="b-' + t + '" x="0" y="' + y + '" width="' + BW +
           '" height="' + BH + '" rx="4"/>';
      s += '<text class="t1 lft' + (t === 'on' ? ' b-ont' : '') + '" x="16" y="' +
           (y + 27) + '">' + b.name + '</text>';
      s += '<text class="t2 rgt" x="' + (BW - 16) + '" y="' + (y + 27) + '">' + b.role + '</text>';
    }
  });
  (hops || []).forEach(function (h) {
    const y1 = rowOf(h[0]) * BSTEP + BH / 2;
    const y2 = rowOf(h[1]) * BSTEP + BH / 2;
    s += '<path class="ar-on" d="M ' + (BW + 8) + ' ' + y1 + ' H 586 V ' + y2 + ' H ' + (BW + 16) + '"/>';
    s += '<polygon class="arh-on" points="' + (BW + 5) + ',' + y2 + ' ' +
         (BW + 16) + ',' + (y2 - 4.5) + ' ' + (BW + 16) + ',' + (y2 + 4.5) + '"/>';
    if (h[2]) {
      s += '<text class="t3 lft" x="596" y="' + ((y1 + y2) / 2) + '" transform="rotate(90 596 ' +
           ((y1 + y2) / 2) + ')">' + h[2] + '</text>';
    }
  });
  return svg('0 0 610 314', s);
}

/* ── 슬라이드 ─────────────────────────────────────────────── */
const S = [

{
  phase: '들머리', layer: '전체', badge: 'gray',
  title: '질문 하나가 여섯 층을 내려갔다 올라온다',
  lead: '관리자가 화면에서 질문을 하나 던지면 그 요청은 서버 안에서 정해진 순서로 층을 타고 내려갔다가, 답이 되어 다시 올라옵니다. 이 자료는 그 길을 처음부터 끝까지 한 걸음씩 따라갑니다.',
  fig: { d: stack([], []), cap: '위가 바깥, 아래가 저장소다. 요청은 위에서 들어와 아래까지 갔다가 답이 되어 올라온다.' },
  steps: [
    '<b>문 넷을 지난다.</b> 토큰 · 사용자 아이디 · 질문 모양 · 오늘 쓴 양.',
    '<b>재료를 모은다.</b> 고객 판을 읽고, 질문 종류를 가르고, 벡터로 근거 자료를 찾는다.',
    '<b>프롬프트를 조립해 모델에게 넘긴다.</b>',
    '<b>답을 조각조각 흘려보내며</b> 뒤에서 사용량을 적는다.'
  ],
  note: { tone: 'teal', h: '층이 갈려 있는 이유',
    p: ['아래층은 위층을 모릅니다. <code class="k">app/domain/</code> 은 DB 도 네트워크도 모르고, <code class="k">app/repositories/</code> 밖에는 SQL 이 한 줄도 없습니다. 그래서 저장소를 갈아 끼워도 위층이 안 바뀝니다.'] },
  facts: { title: '실측 · docs/measurements.md · 2026-08-31',
    cols: ['요청', 'DB 질의', '시간'], mono: [1, 2],
    rows: [['첫 요청 (캐시 빔)', '16번', '0.163초'], ['두 번째 요청', '10번', '0.012초']] },
  cap: 'LLM 호출은 뺀 값입니다. 임베딩기는 미리 올려 둔 상태에서 쟀습니다.'
},

{
  phase: '① 도착', layer: 'web → app/api', title: '무엇이 담겨 오는가',
  lead: '화면이 보내는 것은 헤더 둘과 본문 둘뿐입니다. 이 넷이 뒤에 나오는 모든 판단의 재료가 됩니다.',
  fig: { d: svg('0 0 600 318',
      bx(20, 8, 260, 40, 'POST /api/ask', null, 'on') +
      '<text class="t2 lft" x="296" y="33">요청이 도착한다</text>' +
      '<text class="t3 lft" x="20" y="72">헤더 · 앞단 서버가 붙인다</text>' +
      bx(20, 80, 262, 46, 'Authorization', 'Bearer 서비스 토큰') +
      bx(20, 132, 262, 46, 'X-User-Id', '누구를 대신해 부르나') +
      ar(292, 103, 340, 103) + ar(292, 155, 340, 155) +
      bx(348, 80, 232, 98, 'caller()', 'app/core/auth.py', 'on') +
      '<text class="t3 lft" x="20" y="200">본문 JSON</text>' +
      bx(20, 208, 262, 46, 'question', '2~500자') +
      bx(20, 260, 262, 46, 'customerId', '없어도 된다') +
      ar(292, 231, 340, 231) + ar(292, 283, 340, 283) +
      bx(348, 208, 232, 98, 'AskRequest', 'app/features/schemas.py', 'on')),
    cap: '헤더 둘은 auth 가, 본문 둘은 Pydantic 이 본다. 둘 다 통과해야 함수 안으로 들어온다.' },
  chain: [
    [0, '<b>ask</b>(request, user)', 'api/routers/ask.py'],
    [1, 'Depends(<b>caller</b>)', 'core/auth.py'],
    [1, 'AskRequest 검사', 'features/schemas.py']
  ],
  note: { tone: 'teal', h: '왜 사용자 아이디를 헤더로 받나',
    p: ['이 서버는 로그인을 직접 다루지 않습니다. 앞단 서버가 누구인지 확인한 뒤 "이 사람을 대신해 부른다" 고 알려 주는 구조입니다. 쿼터와 비용 기록이 이 값을 열쇠로 씁니다.'] }
},

/* ── 그리기 ───────────────────────────────────────────────── */
function gridHtml(t) {
  const n = t.cols.length;
  const mono = t.mono || [];
  let h = '';
  if (t.title) h += '<h2>' + esc(t.title) + '</h2>';
  h += '<div class="grid" style="grid-template-columns:' +
       (n === 2 ? '1fr max-content' : '1fr max-content max-content') + '">';
  t.cols.forEach(function (c, i) {
    h += '<div class="h top' + (i ? ' bl' : '') + '">' + esc(c) + '</div>';
  });
  t.rows.forEach(function (r) {
    r.forEach(function (v, i) {
      h += '<div class="' + (mono.indexOf(i) >= 0 ? 'c ' : '') + (i ? 'bl' : '') + '">' +
           esc(v) + '</div>';
    });
  });
  return h + '</div>';
}

function chainHtml(rows) {
  let h = '<div class="chain">';
  rows.forEach(function (r, i) {
    const pad = r[0] ? '  '.repeat(r[0] - 1) + '└ ' : '';
    h += '<div class="fn' + (i ? '' : ' top') + '">' + pad + r[1] + '</div>';
    h += '<div class="at' + (i ? '' : ' top') + '">' + esc(r[2] || '') + '</div>';
  });
  return h + '</div>';
}

let cur = 0;

function show(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];

  const fig = document.getElementById('figure');
  fig.innerHTML = s.fig.d + (s.fig.cap ? '<p class="figcap">' + s.fig.cap + '</p>' : '');

  const out = [];
  out.push('<div class="eyebrow"><span class="badge' + (s.badge === 'gray' ? ' gray' : '') +
    '">' + esc(s.layer) + '</span><span class="step-no">' + (cur + 1) + ' / ' + S.length +
    '</span></div>');
  out.push('<h1>' + esc(s.title) + '</h1>');
  out.push('<p class="lead">' + s.lead + '</p>');
  if (s.chain) out.push('<div class="sec"><h2>부르는 차례</h2>' + chainHtml(s.chain) + '</div>');
  if (s.steps) {
    let li = '';
    s.steps.forEach(function (t, n) {
      li += '<li><span class="n">' + (n + 1) + '</span><span>' + t + '</span></li>';
    });
    out.push('<div class="sec"><h2>일어나는 일</h2><ol class="steps">' + li + '</ol></div>');
  }
  if (s.note) {
    out.push('<div class="note' + (s.note.tone === 'oxide' ? ' warn' : '') + '"><h3>' +
      esc(s.note.h) + '</h3>' +
      s.note.p.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>');
  }
  if (s.facts) out.push('<div class="sec">' + gridHtml(s.facts) + '</div>');
  if (s.cap) out.push('<p class="cap">' + s.cap + '</p>');
  document.getElementById('notes-in').innerHTML = out.join('');

  document.getElementById('phase').textContent = s.phase;
  document.getElementById('at').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / S.length * 100) + '%';
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === S.length - 1;
  document.getElementById('notes').scrollTop = 0;
  fig.scrollTop = 0;

  try { localStorage.setItem('deck-askflow', String(cur)); } catch (e) {}
}

document.getElementById('of').textContent = S.length;
document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
document.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { show(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); e.preventDefault(); }
  else if (e.key === 'Home') { show(0); e.preventDefault(); }
  else if (e.key === 'End') { show(S.length - 1); e.preventDefault(); }
});

let start = 0;
try { start = Math.min(parseInt(localStorage.getItem('deck-askflow') || '0', 10) || 0, S.length - 1); } catch (e) {}
show(start);
</script>
